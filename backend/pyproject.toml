[project]
name = "tradepilot-backend"
version = "0.1.0"
description = "TradePilot backend — FastAPI API + daily prediction pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pandas>=2.0",  # features/builder dùng chung train+serve (trước đây ăn theo vnstock)
    "redis>=5.2",
    "tzdata>=2024.1",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "structlog>=26.1.0",
    "sentry-sdk[fastapi]>=2.62.0",
]

[dependency-groups]
# Dep ML inference local — KHÔNG vào default install (CI/Render không cài; xem ADR 0002).
# Cài: uv sync --group inference. M5 thêm torch (PhoBERT) vào nhóm này.
inference = [
    "lightgbm>=4.5",
]
# Dep pipeline daily chỉ chạy trên Mac (launchd) — KHÔNG vào image Render (M7, tiết kiệm ~500MB:
# vnstock kéo matplotlib/plotly, google-generativeai kéo googleapiclient/grpc). Import đều lazy.
pipeline = [
    "vnstock>=3.2",
    "google-generativeai>=0.8",  # auto-label sentiment (scripts/autolabel_sentiment)
]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# migration do Alembic tự sinh — không lint theo style thủ công
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends() trong default arg là pattern chuẩn của framework.
"api/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
